version: '3.8'

services:
  nginx:
    image: integrated-nginx:latest
    container_name: integrated-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - backend_uploads:/usr/share/nginx/html/uploads
    networks:
      - integrated-network
    # external_links:
    #   - integrated-backend:backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_uploads:
    external: true

networks:
  integrated-network:
    external: true