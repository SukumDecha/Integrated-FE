name: Deploy Frontend

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter
      run: npm run lint
      
    - name: Build application (test)
      run: npm run build:uat

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    
    steps:
    - uses: actions/checkout@v4

    - name: Install OpenVPN
      run: |
        sudo apt update
        sudo apt install -y openvpn openvpn-systemd-resolved
        
    - name: Connect to VPN
      uses: "kota65535/github-openvpn-connect-action@v2"
      with:
        config_file: .github/workflows/sitst-client.ovpn
        username: ${{ secrets.OVPN_USERNAME }}
        password: ${{ secrets.OVPN_PASSWORD }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build for environment
      run: |
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          npm run build:prod
        else
          npm run build:uat
        fi
        
    - name: Build Docker image (nginx with static files)
      run: |
        docker build -t integrated-nginx:${{ github.sha }} .
        docker tag integrated-nginx:${{ github.sha }} integrated-nginx:latest
        
    - name: Save Docker image
      run: docker save integrated-nginx:latest | gzip > integrated-nginx.tar.gz
      
    - name: Deploy to VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          # Create directory if not exists
          mkdir -p ~/integrated-deployment
          
          # Stop existing containers
          cd ~/integrated-deployment
          docker-compose down || true
          
          # Remove old images
          docker image prune -f
          
    - name: Copy files to VM
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        source: "integrated-nginx.tar.gz,docker-compose.yml"
        target: "~/integrated-deployment/"
        
    - name: Deploy on VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          cd ~/integrated-deployment
          
          # Load Docker image
          docker load < integrated-nginx.tar.gz
          rm integrated-nginx.tar.gz
          
          # Start only nginx service (contains static files)
          docker-compose up -d nginx
          
          # Wait for nginx to be ready
          sleep 15
          
          # Verify deployment
          docker-compose ps nginx
          
          # Test frontend availability through nginx
          curl -f http://localhost || echo "Frontend not yet ready"
          
          # Clean up old images
          docker image prune -f
          
    - name: Repository Dispatch to Backend
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.REPO_ACCESS_TOKEN }}
        repository: ${{ github.repository_owner }}/Integrated-BE
        event-type: frontend-deployed
        client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'