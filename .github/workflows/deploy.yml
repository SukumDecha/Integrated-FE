name: Deploy Frontend

on:
  push:
    branches: [ production, uat, dev ]
  pull_request:
    branches: [ production, uat, dev ]
    
env:
  NODE_VERSION: '20'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter
      run: npm run lint
      
    - name: Build application (test)
      run: npm run build:uat

  build-and-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/uat'
    
    steps:
    - uses: actions/checkout@v4

    - name: Install OpenVPN
      run: |
        sudo apt update
        sudo apt install -y openvpn openvpn-systemd-resolved
        
    - name: Connect to VPN
      uses: "kota65535/github-openvpn-connect-action@v2"
      with:
        config_file: .github/workflows/sitst-client.ovpn
        username: ${{ secrets.OVPN_USERNAME }}
        password: ${{ secrets.OVPN_PASSWORD }}
        
    - name: Build Docker image (nginx with static files)
      run: |
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          BUILD_ENV=prod
        elif [ "${{ github.ref }}" = "refs/heads/uat" ]; then
          BUILD_ENV=uat
        else
          BUILD_ENV=dev
        fi
        
        docker build --build-arg BUILD_ENV=$BUILD_ENV -t integrated-nginx:${{ github.sha }} .
        docker tag integrated-nginx:${{ github.sha }} integrated-nginx:latest
        docker tag integrated-nginx:${{ github.sha }} integrated-nginx:latest
        
    - name: Save Docker image
      run: docker save integrated-nginx:latest | gzip > integrated-nginx.tar.gz
      
    - name: Deploy to VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          # Create directory if not exists
          mkdir -p ~/integrated-deployment
          
          # Stop and remove frontend containers
          cd ~/integrated-deployment
          docker-compose stop nginx || true
          docker-compose rm -f nginx || true
          docker rm -f integrated-nginx || true
          
          # Remove specific old images to prevent corruption
          docker rmi integrated-nginx:latest || true
          # docker image prune -f
          
    - name: Copy files to VM
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        source: "integrated-nginx.tar.gz,docker-compose.yml"
        target: "~/integrated-deployment/"
        
    - name: Deploy on VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          cd ~/integrated-deployment
          
          # Ensure clean nginx base image
          docker pull nginx:alpine || true
          
          # Load Docker image
          docker load < integrated-nginx.tar.gz
          rm integrated-nginx.tar.gz
          
          # Create network and volumes if they don't exist
          docker network create integrated-network 2>/dev/null || true
          docker volume create backend_uploads 2>/dev/null || true
          
          # Start only nginx service (contains static files)
          docker-compose up -d --build nginx
          
          # Wait for nginx to be ready
          sleep 15
          
          # Verify deployment
          docker-compose ps nginx
          
          # Test frontend availability through nginx
          curl -f http://localhost || echo "Frontend not yet ready"
          