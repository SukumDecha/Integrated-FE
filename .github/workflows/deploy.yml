name: Deploy Frontend

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter
      run: npm run lint
      
    - name: Build application (test)
      run: npm run build

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build for environment
      run: |
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          npm run build:prod
        else
          npm run build:uat
        fi
        
    - name: Build Docker image
      run: |
        docker build -t integrated-fe:${{ github.sha }} .
        docker tag integrated-fe:${{ github.sha }} integrated-fe:latest
        
    - name: Save Docker image
      run: docker save integrated-fe:latest | gzip > integrated-fe.tar.gz
      
    - name: Deploy to VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          # Create directory if not exists
          mkdir -p ~/integrated-fe
          
          # Stop existing containers
          cd ~/integrated-fe
          docker-compose down || true
          
          # Remove old images
          docker image prune -f
          
          # Ensure backend db files are available
          mkdir -p ~/integrated-be/db
          
    - name: Copy files to VM
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        source: "integrated-fe.tar.gz,docker-compose.yml,nginx/"
        target: "~/integrated-fe/"
        
    - name: Deploy on VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          cd ~/integrated-fe
          
          # Load Docker image
          docker load < integrated-fe.tar.gz
          rm integrated-fe.tar.gz
          
          # Start services (including database from docker-compose)
          docker-compose up -d
          
          # Wait for services to be ready
          sleep 30
          
          # Verify deployment
          docker-compose ps
          
          # Test frontend availability
          curl -f http://localhost || echo "Frontend not yet ready"
          
          # Clean up old images
          docker image prune -f
          
    - name: Repository Dispatch to Backend
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.REPO_ACCESS_TOKEN }}
        repository: ${{ github.repository_owner }}/Integrated-BE
        event-type: frontend-deployed
        client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'