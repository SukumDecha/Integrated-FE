server {
    listen 80;
    server_name intproj24.sit.kmutt.ac.th ip24ssa1.sit.kmutt.ac.th;

    return 301 https://$host$uri$is_args$args;
}

server {
    listen 443 ssl http2;
    server_name intproj24.sit.kmutt.ac.th ip24ssa1.sit.kmutt.ac.th;
    
    ssl_certificate /ssl/fullchain.pem;
    ssl_certificate_key /ssl/privkey.pem;
    ssl_dhparam /ssl/dhparam-2048.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /ssa1/ {
        alias /usr/share/nginx/html/;
        index index.html;
        # ✅ Fixed: Try files within /ssa1 directory
        try_files $uri $uri/ /ssa1/index.html;
    }

    location /ssa1/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control no-cache;
    }

    location /itb-mshop/ {
        proxy_pass http://integrated-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Charset "utf-8";
    }

    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        autoindex on;
    }

}