server {
    listen 80;
    server_name intproj24.sit.kmutt.ac.th ip24ssa1.sit.kmutt.ac.th;

    # Redirect all HTTP to HTTPS - preserve full path and query string
    # Use $request_uri to ensure the path (/ssa1/) and query string are preserved.
    return 301 https://$host$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    server_name intproj24.sit.kmutt.ac.th ip24ssa1.sit.kmutt.ac.th;
    
    # ============ SSL Configuration ============
    ssl_certificate /ssl/fullchain.pem;
    ssl_certificate_key /ssl/privkey.pem;
    ssl_dhparam /ssl/dhparam-2048.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ============ General Settings ============
    client_max_body_size 20M;

    # ============ Location Blocks (Order matters!) ============

    # 1. Backend API Proxy
    location /itb-mshop/ {
        proxy_pass http://integrated-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Charset "utf-8";
    }

    # 2. File Uploads
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        autoindex on;
    }

    # 3. /ssa1/ SPA Application (Specific path - comes before root /)
    location /ssa1/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /ssa1/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 4. /ssa1/index.html (No cache for index)
    location = /ssa1/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 5. Root SPA Application (General path - comes after specific paths)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

}